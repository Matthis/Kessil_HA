[project]
name = "kessil-ha"
version = "0.1.14"
description = "Unofficial Home Assistant integration for the Kessil WiFi dongle"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003", "RUF012"]
